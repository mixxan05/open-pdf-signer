  // Which certificate belongs to the key: sign a nonce and verify it with
  // each certificate's public key. Works for every key type and needs no
  // bag attributes.
  function pairKey(p8, certs) {
    var kind = null, key = null, nonce = crypto.getRandomValues(new Uint8Array(32));
    try { kind = keyKind(p8); } catch (e) {}
    if (!kind) return Promise.reject(failure("cryptoKeyUnsupported"));
    var s = SIG[kind];
    return signingKey(p8, kind).catch(function () {
      throw failure("cryptoKeyUnsupported");
    }).then(function (k) {
      key = k;
      return subtle.sign(s.sign, key, nonce);
    }).then(function (sig) {
      return Promise.all(certs.map(function (c) {
        var info;
        try { info = certInfo(c); } catch (e) { return false; }
        if (info.kind !== kind) return false;
        return subtle.importKey("spki", info.spki, s.key, false, ["verify"]).then(function (pub) {
          return subtle.verify(s.sign, pub, sig, nonce);
        }).catch(function () { return false; });
      }));
    }).then(function (hits) {
      var at = hits.indexOf(true);
      if (at < 0) throw failure("cryptoImportFail");
      return { key: key, index: at };
    });
  }

  // Opens the stored key with the passphrase. v1 records kept it under
  // forge's PBKDF2-HMAC-SHA-1 with 2048 rounds (or inside the stored .p12):
  // those are opened the old way once and re-sealed under the current
  // scheme, so the weak copy is gone for good.
  function unlockIdentity(pass) {
    var rec = cryptoCert, view = cryptoView;
    if (rec.v >= 2) {
      return unsealKey(rec.sealed, pass).then(function (p8) {
        return signingKey(p8, view.info.kind).then(function (key) {
          p8.fill(0);
          return key;
        });
      });
    }
    return new Promise(function (resolve) {
      if (rec.type === "gen") {
        var k = forge.pki.decryptRsaPrivateKey(rec.keyData, pass);
        if (!k) throw new Error("wrong passphrase");
        resolve(binToBytes(forge.asn1.toDer(
          forge.pki.wrapRsaPrivateKey(forge.pki.privateKeyToAsn1(k))).getBytes()));
      } else {
        resolve(p12Read(forge.util.decode64(rec.keyData), pass).keys[0]);
      }
    }).then(function (p8) {
      return Promise.all([sealKey(p8, pass), signingKey(p8, view.info.kind)]).then(function (r) {
        cryptoCert = { v: 2, type: rec.type, label: rec.label, certDer: view.info.der,
                       chainDer: view.chain, sealed: r[0] };
        cryptoStore.put(cryptoCert);
        p8.fill(0);
        return r[1];
      });
    });
  }

  function cryptoBusy(on, key) {
    ["btnCryptoCreate", "btnCryptoImport", "btnCryptoGen", "btnCryptoImpGo",
     "btnCryptoUnlock", "btnCryptoRemove"].forEach(function (id) {
      el(id).disabled = on;
    });
    if (key) say("statusCrypto", key);
  }

  function paintCertName() {
    if (!cryptoCert) return;
    var suffix = cryptoCert.type === "gen" ? " (" + t("cryptoSelf") + ")" : "";
    el("cryptoCertName").textContent = t("cryptoCertOk", { name: cryptoCert.label }) + suffix;
  }

  function cryptoPaint() {
    var has = !!cryptoCert;
    el("cryptoSetup").hidden = has;
    el("cryptoReady").hidden = !has;
    el("cryptoFormGen").hidden = true;
    el("cryptoFormImp").hidden = true;
    paintCertName();
    var usable = cryptoOk && !!cryptoView;
    el("cryptoSign").disabled = !usable;
    if (!usable) el("cryptoSign").checked = false;
    el("cryptoLockRow").hidden = !usable || !!cryptoKey;

      der(0x30, derOid(OID.signingTime), der(0x31, derTime(when))),
      der(0x30, derOid(OID.messageDigest), der(0x31, der(0x04, digest))),

  // --- the signature in the PDF -----------------------------------------------
  // Signature dictionary plus a merged, invisible widget field. ByteRange and
  // Contents hold fixed-width placeholders so real values patch in later
  // without shifting a single byte.
  function addSignaturePlaceholder(doc, hexLen, signerName) {
    var ctx = doc.context, N = PDFLib.PDFName;

      M: PDFLib.PDFString.of(pdfDateString(new Date())),

    var taken = fieldNames(ctx, fields), k = 1;

      Type: N.of("Annot"), Subtype: N.of("Widget"),
      FT: N.of("Sig"), T: PDFLib.PDFString.of("Signature" + k),

      // out — pdf-lib never registers xref streams or freed entries.
      if (prev) doc.context.largestObjectNumber = Math.max(doc.context.largestObjectNumber, prev.size - 1);

      var needKit = job.texts.some(function (it) { return it.fontKey.indexOf("doc:") === 0; });
      if (needKit) {
        if (typeof fontkit === "undefined") throw failure("fontkitMissing");
        doc.registerFontkit(fontkit);
      }

      var jobs = [];

      if (job.sig) {
        jobs.push(doc.embedPng(job.sig.png).then(function (image) {
          var pl = job.sig.placement;
          var page = doc.getPage(pl.page - 1);
          var g = job.geom[pl.page];

          // CropBox from pdf.js, the same source the preview was built from.
          var bx1 = g.view[0], by1 = g.view[1], bx2 = g.view[2], by2 = g.view[3];
          var boxW = bx2 - bx1;   // unrotated
          var boxH = by2 - by1;
          var r = g.rotation;
          var u = g.unit || 1;    // /UserUnit: display points per page unit

          // Display space counts y downwards, PDF counts it upwards.
          var X = pl.x / u;
          var Y = (g.dispH - (pl.y + pl.h)) / u;

          // Convert display space back into the unrotated page space.
          // Rotating the image cancels out the display rotation again.
          var bx, by;
          if (r === 90) { bx = boxW - Y; by = X; }
          else if (r === 180) { bx = boxW - X; by = boxH - Y; }
          else if (r === 270) { bx = Y; by = boxH - X; }
          else { bx = X; by = Y; }

          page.drawImage(image, {
            x: bx + bx1,          // account for the CropBox offset
            y: by + by1,
            width: pl.w / u,
            height: pl.h / u,
            rotate: degrees(r)
          });
        }));
      }

      // Each distinct font is embedded once, then every text is drawn with it.
      var fontJobs = {};
      job.texts.forEach(function (it) {
        if (fontJobs[it.fontKey]) return;
        if (it.fontKey.indexOf("doc:") === 0) {
          var f = job.fonts[it.fontKey.slice(4)];
          if (!f) throw failure("fontEmbedFail", { msg: it.fontKey });
          fontJobs[it.fontKey] = Promise.resolve(doc.embedFont(f.data, { subset: true })).catch(function (e) {
            throw failure("fontEmbedFail", { msg: errText(e) });
          });
        } else {
          fontJobs[it.fontKey] = Promise.resolve(doc.embedFont(PDFLib.StandardFonts[it.fontKey.slice(4)]));
        }
      });

      var keys = Object.keys(fontJobs);
      jobs.push(Promise.all(keys.map(function (k) { return fontJobs[k]; })).then(function (fonts) {
        var map = {};
        keys.forEach(function (k, i) { map[k] = fonts[i]; });
        job.texts.forEach(function (it) {
          var g = job.geom[it.page];
          // Never skip a text quietly: missing geometry is a bug, not a detail.
          if (!g) throw new Error("no geometry for page " + it.page);
          var page = doc.getPage(it.page - 1);
          var bx1 = g.view[0], by1 = g.view[1], bx2 = g.view[2], by2 = g.view[3];
          var boxW = bx2 - bx1, boxH = by2 - by1, r = g.rotation;

          // y is the first baseline — the same anchor the preview uses. Like
          // the image, position and size shed the page's /UserUnit.
          var u = g.unit || 1, size = it.size / u;
          var X = it.x / u;
          var Y = (g.dispH - it.y) / u;
          var bx, by;
          if (r === 90) { bx = boxW - Y; by = X; }
          else if (r === 180) { bx = boxW - X; by = boxH - Y; }
          else if (r === 270) { bx = Y; by = boxH - X; }
          else { bx = X; by = Y; }

          var c = it.color;
          var col = PDFLib.rgb(
            parseInt(c.slice(1, 3), 16) / 255,
            parseInt(c.slice(3, 5), 16) / 255,
            parseInt(c.slice(5, 7), 16) / 255
          );
          var fnt = map[it.fontKey];
          // Subset fonts routinely carry no U+0020 — drawing a space would
          // leave a notdef box. Space is only an advance anyway, so words
          // are drawn separately with a fixed gap pushed along the rotated
          // text direction.
          var df = it.fontKey.indexOf("doc:") === 0 ? job.fonts[it.fontKey.slice(4)] : null;
          var noSpace = df && df.kf && !df.kf.hasGlyphForCodePoint(0x20);
          if (!noSpace) {
            page.drawText(it.text, {
              x: bx + bx1, y: by + by1, size: size, font: fnt,
              color: col, rotate: degrees(r), lineHeight: size * 1.2
            });
          } else {
            var rad = r * Math.PI / 180;
            var ux = Math.cos(rad), uy = Math.sin(rad);      // word advance
            var vx = Math.sin(rad), vy = -Math.cos(rad);     // line advance
            var lh = size * 1.2, gap = size * 0.25;
            var lines = it.text.split(/\r\n|\r|\n/);
            for (var li = 0; li < lines.length; li++) {
              var segs = lines[li].split(/([ \t ]+)/);
              var adv = 0;
              var lx = bx + bx1 + vx * li * lh, ly = by + by1 + vy * li * lh;
              for (var si = 0; si < segs.length; si++) {
                var seg = segs[si];
                if (!seg) continue;
                if (/^[ \t ]+$/.test(seg)) {
                  adv += seg.length * gap;
                } else {
                  page.drawText(seg, {
                    x: lx + ux * adv, y: ly + uy * adv, size: size,
                    font: fnt, color: col, rotate: degrees(r)
                  });
                  adv += fnt.widthOfTextAtSize(seg, size);
                }
              }
            }
          }
        });
      }));

      return Promise.all(jobs).then(function () {
        // The digital signature wraps everything else, so its dictionary goes
        // in last and the CMS blob patches the reserved bytes afterwards.
        var sigRef = job.signer ? addSignaturePlaceholder(doc, job.signer.hexLen, job.signer.label) : null;
        return doc.flush().then(function () {
          if (prev) return writeUpdate(doc, job.bytes, snap, prev, trailer);
          return writeWhole(doc).then(function (bytes) { return { bytes: bytes, spans: null }; });
        }).then(function (out) {
          if (!sigRef) return out.bytes;
          return Promise.resolve().then(function () {
            var span = out.spans ? out.spans[sigRef.toString()] : findObject(out.bytes, sigRef);
            return injectSignature(out.bytes, span, job.signer.sign);
          }).catch(function (err) {
            throw failure("cryptoSignFail", { msg: errText(err) });
          });
        });
      });
    });
  }

  // Unlocks on demand — the passphrase may still wait in the unlock field —
  // and hands buildPdf what it needs to sign.
  function readySigner() {
    var ready = cryptoKey ? Promise.resolve(cryptoKey) :
      unlockIdentity(el("cryptoUnlockPass").value).then(function (key) {
        cryptoKey = key;
        el("cryptoUnlockPass").value = "";
        cryptoPaint();
        return key;
      }, function () {
        throw failure("cryptoNeedUnlock");
      });
    return ready.then(function (key) {
      var view = cryptoView;
      return {
        label: view.label,
        hexLen: cmsSize(view) * 2 + 64,
        sign: function (data) { return cmsSign(view, key, data); }
      };
    });
  }

  function copyOf(o) {
    var c = {};
    for (var k in o) c[k] = o[k];
    return c;
  }

  var saving = false;
  el("btnSave").addEventListener("click", function () {
    var hasSig = !!(sigPng && placement);
    var wantCrypto = cryptoWantsSign();
    if (saving || !originalBytes || (!hasSig && !texts.length && !wantCrypto)) return;

    // Missing glyphs would end up as silent blank spots — check before
    // anything is written.
    for (var i = 0; i < texts.length; i++) {
      var miss = missingGlyphs(texts[i].fontKey, texts[i].text);
      if (miss.length) {
        say("statusSave", "fontNoGlyphs", { chars: miss.join(" ") }, "bad");
        return;
      }
    }
    saving = true;
    say("statusSave", "writing");

    // The marks as they are now: edits made while the file is being written
    // must not leak into it halfway.
    var job = {
      bytes: originalBytes, fonts: docFonts, geom: {}, signer: null,
      sig: hasSig ? { png: sigPng, placement: copyOf(placement) } : null,
      texts: texts.map(copyOf)
    };
    var name = originalName, doc = pdfDoc, pages = {};
    if (hasSig) pages[placement.page] = true;
    job.texts.forEach(function (it) { pages[it.page] = true; });

    (wantCrypto ? readySigner() : Promise.resolve(null)).then(function (signer) {
      job.signer = signer;
      return Promise.all(Object.keys(pages).map(function (n) {
        return pageGeometry(+n, doc).then(function (g) { job.geom[n] = g; });
      }));
    }).then(function () {
      return buildPdf(job);
    }).then(function (bytes) {
      var blob = new Blob([bytes], { type: "application/pdf" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = name.replace(/\.pdf$/i, "") + "-signed.pdf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
      say("statusSave", "saved", { name: a.download }, "good");
    }).catch(function (err) {
      if (err && err.i18n) say("statusSave", err.i18n.key, err.i18n.vars, "bad");
      else say("statusSave", "saveFailed", { msg: errText(err) }, "bad");
    }).then(function () {
      saving = false;
    });
  });

  // ===========================================================================
  // Control availability
  // ===========================================================================
  function refreshControls() {
    var hasPdf = !!pdfDoc;
    el("btnPrev").disabled = !hasPdf || pageNow <= 1;
    el("btnNext").disabled = !hasPdf || pageNow >= pageTotal;
    el("btnZoomOut").disabled = !hasPdf || zoom <= ZOOM_MIN;
    el("btnZoomIn").disabled = !hasPdf || zoom >= ZOOM_MAX;
    el("zoomLabel").disabled = !hasPdf;
    el("btnNew").disabled = !hasPdf && !sigPng && !texts.length;
    el("btnPlace").disabled = !hasPdf || !sigPng;
    el("btnRemove").disabled = !placement;
    el("btnAddText").disabled = !hasPdf;
    el("btnRemoveText").disabled = selectedText == null;
    el("btnSave").disabled = !(hasPdf && ((sigPng && placement) || texts.length || cryptoWantsSign()));

    if (!hasPdf) say("statusPlace", null);
    else if (!sigPng) say("statusPlace", "needSignature");
    else if (!placement) say("statusPlace", "notPlaced");
    else say("statusPlace", "placedOn", { n: placement.page }, "good");
  }

  applyLanguage();
  refreshControls();

  // Reopen the stored session, if there is one — the empty state paints
  // first, the document follows as soon as it is read back.
  idbGet().then(function (s) {
    // pdfDoc/userPickedFile means the user already picked a file before the
    // restore answer arrived — that wins, the stored session stays untouched.
    if (!s || !s.pdf || pdfDoc || userPickedFile) return;
    say("statusPdf", "loading");
    var bytes = s.pdf instanceof Uint8Array ? s.pdf : new Uint8Array(s.pdf);
    openPdf(bytes, s.name).then(function (ok) {
      // Restore onto exactly the document this load put on screen. A pick
      // made meanwhile either replaced it (originalBytes is then another
      // array) or failed — a dropped PNG, say — and must not cost the marks.
      if (ok && originalBytes === bytes) restoreState(s);
    });
  });
})();
</script>
</body>
</html>
