<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open PDF Signer</title>
<!-- Empty favicon so the browser does not request favicon.ico -->
<link rel="icon" href="data:,">
<style>
  :root {
    /* Ink and paper */
    --ink:        #141F28;
    --ink-soft:   #4A5A66;
    --ink-faint:  #8493A0;
    --paper:      #FFFFFF;
    --panel:      #F6F7F5;
    --panel-edge: #DFE2DD;

    /* The cutting mat the document lies on */
    --mat:        #46595A;
    --mat-deep:   #3A4B4C;
    --mat-line:   rgba(255, 255, 255, .07);
    --mat-line-5: rgba(255, 255, 255, .13);

    /* The single accent: the red used for dimensioning on technical drawings */
    --dim:        #C0472B;
    --dim-soft:   rgba(192, 71, 43, .14);

    --ok:         #2F6B4F;

    --face-din: Bahnschrift, "DIN Alternate", "Avenir Next Condensed", "Segoe UI", system-ui, sans-serif;
    --face-body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    --face-num: Consolas, "SF Mono", ui-monospace, "DejaVu Sans Mono", monospace;

    --rail: 300px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    font-family: var(--face-body);
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--mat);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------------------------------------------------------------- header */
  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 18px;
    height: 52px;
    background: var(--ink);
    color: #EDF1F2;
    border-bottom: 2px solid var(--dim);
  }
  .wordmark {
    font-family: var(--face-din);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin: 0;
    white-space: nowrap;
  }
  .wordmark .mark { color: var(--dim); }
  .claim {
    font-size: 12px;
    color: #9DAEB4;
    border-inline-start: 1px solid #33414B;
    padding-inline-start: 16px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .langpick { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; flex: none; }
  .langpick svg { width: 15px; height: 15px; stroke: #9DAEB4; fill: none; stroke-width: 1.5; }
  #language {
    font: inherit;
    font-size: 13px;
    color: #EDF1F2;
    background: #22303A;
    border: 1px solid #3B4C57;
    border-radius: 3px;
    padding: 4px 6px;
    cursor: pointer;
  }
  #language option { background: #22303A; color: #EDF1F2; }

  /* ------------------------------------------------------------ two panes */
  .workspace { flex: 1; display: flex; min-height: 0; }

  .rail {
    width: var(--rail);
    flex: none;
    background: var(--panel);
    border-inline-end: 1px solid var(--panel-edge);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .rail-scroll { flex: 1; overflow-y: auto; min-height: 0; }

  .step { padding: 15px 18px; border-bottom: 1px solid var(--panel-edge); }
  .step-head { display: flex; align-items: baseline; gap: 9px; margin-bottom: 11px; }
  .step-num {
    font-family: var(--face-num);
    font-size: 11px;
    color: var(--dim);
    letter-spacing: .04em;
  }
  .step-name {
    font-family: var(--face-din);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--ink);
    margin: 0;
  }
  .note { margin: 9px 0 0; font-size: 12px; color: var(--ink-soft); }

  /* --------------------------------------------------------------- inputs */
  button {
    font-family: var(--face-body);
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid #C9CEC8;
    border-radius: 3px;
    background: #FFF;
    color: var(--ink);
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  button:hover:not(:disabled) { background: #EFF1EE; border-color: #A9B1AB; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--dim); outline-offset: 2px; }

  .row { display: flex; gap: 7px; }
  .row > button { flex: 1; }

  .filepick {
    display: block;
    border: 1px dashed #B9C0BA;
    border-radius: 3px;
    background: #FFF;
    padding: 13px;
    text-align: center;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink-soft);
    transition: border-color .12s, background .12s;
  }
  .filepick:hover { border-color: var(--dim); background: #FFFCFB; color: var(--ink); }
  .filepick input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .filepick strong { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }

  /* Toggle between drawing and uploading */
  .switch {
    display: flex;
    background: #E9ECE8;
    border-radius: 3px;
    padding: 2px;
    margin-bottom: 11px;
  }
  .switch button {
    flex: 1;
    border: 0;
    background: transparent;
    padding: 5px 4px;
    font-size: 12.5px;
    color: var(--ink-soft);
    border-radius: 2px;
  }
  .switch button:hover:not([aria-selected=true]) { background: rgba(255,255,255,.6); }
  .switch button[aria-selected=true] {
    background: #FFF;
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(20,31,40,.12);
  }

  /* Transparency is shown by a checkerboard behind the canvas, never inside it */
  .checker {
    background-color: #FFF;
    background-image:
      linear-gradient(45deg, #E6E9E5 25%, transparent 25%, transparent 75%, #E6E9E5 75%),
      linear-gradient(45deg, #E6E9E5 25%, transparent 25%, transparent 75%, #E6E9E5 75%);
    background-size: 12px 12px;
    background-position: 0 0, 6px 6px;
  }
  #padCanvas {
    width: 100%;
    height: 122px;
    display: block;
    border: 1px solid #C9CEC8;
    border-radius: 3px;
    touch-action: none;
    cursor: crosshair;
  }
  #padCanvas:hover { border-color: #A9B1AB; }

  #sigPreview {
    margin-top: 10px;
    width: 100%;
    max-height: 62px;
    object-fit: contain;
    display: none;
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    padding: 4px;
  }

  .status { margin-top: 9px; font-size: 12px; min-height: 1em; color: var(--ink-soft); }
  .status.bad { color: var(--dim); }
  .status.good { color: var(--ok); }

  /* Save stays reachable no matter how short the window is */
  .rail-foot {
    flex: none;
    padding: 13px 18px;
    border-top: 1px solid var(--panel-edge);
    background: var(--panel);
  }
  #btnSave {
    width: 100%;
    padding: 11px;
    background: var(--dim);
    border-color: var(--dim);
    color: #FFF;
    font-weight: 600;
    font-size: 13.5px;
    letter-spacing: .02em;
  }
  #btnSave:hover:not(:disabled) { background: #A93C22; border-color: #A93C22; }
  #btnSave:disabled { background: #C9CEC8; border-color: #C9CEC8; color: #FFF; opacity: 1; }

  /* ---------------------------------------------------------------- stage */
  /* The document itself is never mirrored, not even in right-to-left layouts */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; direction: ltr; }

  .pagebar {
    flex: none;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 16px;
    background: var(--mat-deep);
    color: #C8D4D5;
    font-size: 12.5px;
    border-bottom: 1px solid rgba(0,0,0,.22);
  }
  .pagebar button {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    color: #DCE5E6;
    padding: 3px 10px;
    line-height: 1.35;
  }
  .pagebar button:hover:not(:disabled) { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.26); }
  .pagebar button:disabled { opacity: .3; }
  .pagebar label { font-family: var(--face-din); letter-spacing: .12em; text-transform: uppercase; font-size: 11px; }
  #pageSelect {
    font-family: var(--face-num);
    font-size: 12.5px;
    background: rgba(0,0,0,.26);
    color: #EDF1F2;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 3px;
    padding: 3px 5px;
    cursor: pointer;
  }
  #pageSelect option { background: #2F3E3F; }
  #pageCount { font-family: var(--face-num); color: #93A5A6; }
  #placeState {
    margin-inline-start: auto;
    font-size: 11.5px;
    font-family: var(--face-din);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #93A5A6;
  }
  #placeState.here { color: #E9B4A5; }

  /* Millimetre grid, drawn in CSS so it costs no request */
  .stage {
    flex: 1;
    overflow: auto;
    padding: 30px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background-color: var(--mat);
    background-image:
      repeating-linear-gradient(0deg, var(--mat-line) 0 1px, transparent 1px 20px),
      repeating-linear-gradient(90deg, var(--mat-line) 0 1px, transparent 1px 20px),
      repeating-linear-gradient(0deg, var(--mat-line-5) 0 1px, transparent 1px 100px),
      repeating-linear-gradient(90deg, var(--mat-line-5) 0 1px, transparent 1px 100px);
  }

  .empty {
    margin-top: 70px;
    text-align: center;
    color: #A6B6B7;
    font-size: 13px;
    max-width: 300px;
  }
  .empty svg { width: 44px; height: 44px; stroke: #7C9092; fill: none; stroke-width: 1.2; margin-bottom: 12px; }
  .empty b { display: block; color: #D3DEDF; font-weight: 600; font-size: 14px; margin-bottom: 5px; }

  .sheet {
    position: relative;
    display: none;
    line-height: 0;
    background: var(--paper);
    box-shadow: 0 3px 10px rgba(0,0,0,.3), 0 14px 42px rgba(0,0,0,.24);
  }
  .sheet.on { display: inline-block; }
  #pageCanvas { display: block; }

  /* -------------------------------------------------- signature and dimensions */
  #sigBox {
    position: absolute;
    display: none;
    touch-action: none;
    cursor: grab;
    outline: 1px solid var(--dim);
    background: var(--dim-soft);
  }
  #sigBox.on { display: block; }
  #sigBox:active { cursor: grabbing; }
  #sigBox img { width: 100%; height: 100%; display: block; pointer-events: none; }

  /* Corner handle shaped like a registration mark rather than a generic dot */
  #handle {
    position: absolute;
    right: -7px;
    bottom: -7px;
    width: 15px;
    height: 15px;
    border-inline-end: 3px solid var(--dim);
    border-bottom: 3px solid var(--dim);
    background: rgba(255,255,255,.82);
    cursor: nwse-resize;
    touch-action: none;
  }

  /* Live measurements: the point of this tool made visible */
  .dim {
    position: absolute;
    font-family: var(--face-num);
    font-size: 10px;
    line-height: 1;
    color: var(--dim);
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
  }
  .dim-w {
    bottom: calc(100% + 5px);
    left: 0;
    right: 0;
    text-align: center;
    border-bottom: 1px solid var(--dim);
    padding-bottom: 3px;
  }
  .dim-w::before, .dim-w::after {
    content: "";
    position: absolute;
    bottom: -3px;
    width: 1px;
    height: 7px;
    background: var(--dim);
  }
  .dim-w::before { left: 0; }
  .dim-w::after { right: 0; }
  .dim-h {
    left: calc(100% + 5px);
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    border-left: 1px solid var(--dim);
    padding-left: 4px;
  }
  .dim-h::before, .dim-h::after {
    content: "";
    position: absolute;
    left: -3px;
    height: 1px;
    width: 7px;
    background: var(--dim);
  }
  .dim-h::before { top: 0; }
  .dim-h::after { bottom: 0; }
  .dim-xy {
    top: calc(100% + 5px);
    left: 0;
    background: var(--dim);
    color: #FFF;
    padding: 2px 5px;
    border-radius: 2px;
  }

  /* ------------------------------------------------------------ responsive */
  @media (max-width: 820px) {
    .workspace { flex-direction: column; }
    .rail { width: 100%; border-inline-end: 0; border-bottom: 1px solid var(--panel-edge); max-height: 52vh; }
    .claim { display: none; }
    .stage { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <h1 class="wordmark">Open PDF <span class="mark">Signer</span></h1>
  <span class="claim" data-i18n="claim"></span>
  <span class="langpick">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></svg>
    <select id="language" aria-label="Language"></select>
  </span>
</header>

<div class="workspace">
  <aside class="rail">
    <div class="rail-scroll">

      <section class="step">
        <div class="step-head">
          <span class="step-num">01</span>
          <h2 class="step-name" data-i18n="stepDocument"></h2>
        </div>
        <label class="filepick">
          <strong data-i18n="choosePdf"></strong>
          <span data-i18n="choosePdfHint"></span>
          <input type="file" id="pdfInput" accept="application/pdf,.pdf">
        </label>
        <div class="status" id="statusPdf"></div>
      </section>

      <section class="step">
        <div class="step-head">
          <span class="step-num">02</span>
          <h2 class="step-name" data-i18n="stepSignature"></h2>
        </div>
        <div class="switch" role="tablist">
          <button id="tabDraw" role="tab" aria-selected="true" data-i18n="tabDraw"></button>
          <button id="tabUpload" role="tab" aria-selected="false" data-i18n="tabUpload"></button>
        </div>

        <div id="paneDraw">
          <canvas id="padCanvas" class="checker"></canvas>
          <div class="row" style="margin-top:8px">
            <button id="btnClear" data-i18n="clear"></button>
            <button id="btnApply" data-i18n="apply"></button>
          </div>
          <p class="note" data-i18n="drawNote"></p>
        </div>

        <div id="paneUpload" hidden>
          <label class="filepick">
            <strong data-i18n="choosePng"></strong>
            <span data-i18n="choosePngHint"></span>
            <input type="file" id="pngInput" accept="image/png,.png">
          </label>
          <p class="note" data-i18n="uploadNote"></p>
        </div>

        <img id="sigPreview" class="checker" alt="">
        <div class="status" id="statusSignature"></div>
      </section>

      <section class="step">
        <div class="step-head">
          <span class="step-num">03</span>
          <h2 class="step-name" data-i18n="stepPlace"></h2>
        </div>
        <div class="row">
          <button id="btnPlace" disabled data-i18n="placeHere"></button>
          <button id="btnRemove" disabled data-i18n="remove"></button>
        </div>
        <p class="note" data-i18n="placeNote"></p>
        <div class="status" id="statusPlace"></div>
      </section>

      <section class="step" style="border-bottom:0">
        <div class="step-head">
          <span class="step-num">04</span>
          <h2 class="step-name" data-i18n="stepSave"></h2>
        </div>
        <p class="note" style="margin-top:0" data-i18n="saveNote"></p>
        <div class="status" id="statusSave"></div>
      </section>

    </div>

    <div class="rail-foot">
      <button id="btnSave" disabled data-i18n="saveButton"></button>
    </div>
  </aside>

  <main>
    <div class="pagebar">
      <button id="btnPrev" disabled aria-label="Previous page">&#9664;</button>
      <label for="pageSelect" data-i18n="page"></label>
      <select id="pageSelect" disabled></select>
      <span id="pageCount">&mdash;</span>
      <button id="btnNext" disabled aria-label="Next page">&#9654;</button>
      <span id="placeState"></span>
    </div>

    <div class="stage" id="stage">
      <div class="empty" id="empty">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8.5 16.5c1.2-1.6 2-3.4 2.7-2.2.7 1.2 1 2.6 1.9 1.4.9-1.2 1.6.3 2.4.8"/></svg>
        <b data-i18n="emptyTitle"></b>
        <span data-i18n="emptyBody"></span>
      </div>

      <div class="sheet" id="sheet">
        <canvas id="pageCanvas"></canvas>
        <div id="sigBox">
          <img id="sigImage" alt="">
          <span class="dim dim-w" id="dimW"></span>
          <span class="dim dim-h" id="dimH"></span>
          <span class="dim dim-xy" id="dimXY"></span>
          <div id="handle"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

        }
      }
      paintPlacement();
      refreshControls();
    };
    img.onerror = function () { say("statusSignature", "imageFailed", null, "bad"); };
    img.src = dataUrl;
  }

  function placeOnCurrentPage() {
    var g = geometry[pageNow];
    if (!g || !sigPng) return;
    var w = g.dispW * 0.3;
    var h = w / sigRatio;
    placement = { page: pageNow, x: (g.dispW - w) / 2, y: (g.dispH - h) / 2, w: w, h: h };
  }

  el("btnPlace").addEventListener("click", function () {
    if (!sigPng || !pdfDoc) return;
    placeOnCurrentPage();
    paintPlacement();
    refreshControls();
  });

  el("btnRemove").addEventListener("click", function () {
    placement = null;
    paintPlacement();
    refreshControls();
  });

  // ===========================================================================
  // Show the placement: points to screen pixels
  // ===========================================================================
  // Measured rather than assumed, so any CSS scaling of the canvas is covered
  // and this is the same factor the export maths uses.
  function pixelsPerPoint() {
    var g = geometry[pageNow];
    if (!g) return 1;
    return pageCanvas.getBoundingClientRect().width / g.dispW;
  }

  function paintPlacement() {
    var visible = !!(placement && sigPng && placement.page === pageNow);
    sigBox.classList.toggle("on", visible);

    if (visible) {
      var s = pixelsPerPoint();
      sigBox.style.left = (placement.x * s) + "px";
      sigBox.style.top = (placement.y * s) + "px";
      sigBox.style.width = (placement.w * s) + "px";
      sigBox.style.height = (placement.h * s) + "px";
      // Live dimensions in PDF points, the unit the export actually writes
      el("dimW").textContent = placement.w.toFixed(1) + " pt";
      el("dimH").textContent = placement.h.toFixed(1) + " pt";
      el("dimXY").textContent = "x " + placement.x.toFixed(1) + "  y " + placement.y.toFixed(1);
    }

    var state = el("placeState");
    state.classList.toggle("here", !!(placement && placement.page === pageNow));
    if (!pdfDoc || !sigPng) state.textContent = "";
    else if (!placement) state.textContent = t("stateNone");
    else if (placement.page === pageNow) state.textContent = t("stateHere");
    else state.textContent = t("stateOther", { n: placement.page });
  }

  // ===========================================================================
  // Move and scale
  // ===========================================================================
  var drag = null;

  function dragStart(ev) {
    if (!placement || placement.page !== pageNow) return;
    drag = {
      mode: ev.currentTarget === handle ? "scale" : "move",
      startX: ev.clientX,
      startY: ev.clientY,
      from: { x: placement.x, y: placement.y, w: placement.w, h: placement.h },
      s: pixelsPerPoint()
    };
    ev.currentTarget.setPointerCapture(ev.pointerId);
    ev.preventDefault();
    ev.stopPropagation();
  }

  function dragMove(ev) {
    if (!drag) return;
    var g = geometry[pageNow];
    var dx = (ev.clientX - drag.startX) / drag.s;   // in PDF points
    var dy = (ev.clientY - drag.startY) / drag.s;
    var a = drag.from;

    if (drag.mode === "move") {
      placement.x = Math.min(Math.max(a.x + dx, 0), Math.max(0, g.dispW - a.w));
      placement.y = Math.min(Math.max(a.y + dy, 0), Math.max(0, g.dispH - a.h));
    } else {
      // Proportional, anchored at the top left corner
      var w = Math.max(15, a.w + dx);
      w = Math.min(w, g.dispW - a.x);
      var h = w / sigRatio;
      if (a.y + h > g.dispH) {
        h = g.dispH - a.y;
        w = h * sigRatio;
      }
      placement.w = w;
      placement.h = h;
    }
    paintPlacement();
    ev.preventDefault();
  }

  function dragEnd(ev) {
    if (!drag) return;
    drag = null;
    if (ev.currentTarget.hasPointerCapture(ev.pointerId)) ev.currentTarget.releasePointerCapture(ev.pointerId);
  }

  [sigBox, handle].forEach(function (node) {
    node.addEventListener("pointerdown", dragStart);
    node.addEventListener("pointermove", dragMove);
    node.addEventListener("pointerup", dragEnd);
    node.addEventListener("pointercancel", dragEnd);
  });

  // ===========================================================================
  // Step 4: export
  // ===========================================================================
  el("btnSave").addEventListener("click", function () {
    if (!originalBytes || !sigPng || !placement) return;
    say("statusSave", "writing");

    var PDFDocument = PDFLib.PDFDocument;
    var degrees = PDFLib.degrees;

    // ignoreEncryption covers PDFs that only set permissions.
    PDFDocument.load(originalBytes, { ignoreEncryption: true }).then(function (doc) {
      return doc.embedPng(sigPng).then(function (image) {
        var page = doc.getPage(placement.page - 1);
        var g = geometry[placement.page];

        // CropBox from pdf.js, the same source the preview was built from.
        var bx1 = g.view[0], by1 = g.view[1], bx2 = g.view[2], by2 = g.view[3];
        var boxW = bx2 - bx1;   // unrotated
        var boxH = by2 - by1;
        var r = g.rotation;

        // Display space counts y downwards, PDF counts it upwards.
        var X = placement.x;
        var Y = g.dispH - (placement.y + placement.h);

        // Convert display space back into the unrotated page space.
        // Rotating the image cancels out the display rotation again.
        var bx, by;
        if (r === 90) { bx = boxW - Y; by = X; }
        else if (r === 180) { bx = boxW - X; by = boxH - Y; }
        else if (r === 270) { bx = Y; by = boxH - X; }
        else { bx = X; by = Y; }

        page.drawImage(image, {
          x: bx + bx1,          // account for the CropBox offset
          y: by + by1,
          width: placement.w,
          height: placement.h,
          rotate: degrees(r)
        });

        return doc.save();
      });
    }).then(function (bytes) {
      var blob = new Blob([bytes], { type: "application/pdf" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = originalName.replace(/\.pdf$/i, "") + "-signed.pdf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
      say("statusSave", "saved", { name: a.download }, "good");
    }).catch(function (err) {
      say("statusSave", "saveFailed", { msg: err && err.message ? err.message : String(err) }, "bad");
    });
  });

  // ===========================================================================
  // Control availability
  // ===========================================================================
  function refreshControls() {
    var hasPdf = !!pdfDoc;
    el("btnPrev").disabled = !hasPdf || pageNow <= 1;
    el("btnNext").disabled = !hasPdf || pageNow >= pageTotal;
    el("btnPlace").disabled = !hasPdf || !sigPng;
    el("btnRemove").disabled = !placement;
    el("btnSave").disabled = !(hasPdf && sigPng && placement);

    if (!hasPdf) say("statusPlace", null);
    else if (!sigPng) say("statusPlace", "needSignature");
    else if (!placement) say("statusPlace", "notPlaced");
    else say("statusPlace", "placedOn", { n: placement.page }, "good");
  }

  applyLanguage();
  refreshControls();
})();
</script>
</body>
</html>
