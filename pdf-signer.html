<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open PDF Signer</title>
<!-- Empty favicon so the browser does not request favicon.ico -->
<link rel="icon" href="data:,">
<style>
  :root {
    /* Ink and paper */
    --ink:        #141F28;
    --ink-soft:   #4A5A66;
    --ink-faint:  #8493A0;
    --paper:      #FFFFFF;
    --panel:      #F6F7F5;
    --panel-edge: #DFE2DD;

    /* The cutting mat the document lies on */
    --mat:        #46595A;
    --mat-deep:   #3A4B4C;
    --mat-line:   rgba(255, 255, 255, .07);
    --mat-line-5: rgba(255, 255, 255, .13);

    /* The single accent: the red used for dimensioning on technical drawings */
    --dim:        #C0472B;
    --dim-soft:   rgba(192, 71, 43, .14);

    --ok:         #2F6B4F;

    --face-din: Bahnschrift, "DIN Alternate", "Avenir Next Condensed", "Segoe UI", system-ui, sans-serif;
    --face-body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    --face-num: Consolas, "SF Mono", ui-monospace, "DejaVu Sans Mono", monospace;

    --rail: 300px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    font-family: var(--face-body);
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--mat);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------------------------------------------------------------- header */
  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 18px;
    height: 52px;
    background: var(--ink);
    color: #EDF1F2;
    border-bottom: 2px solid var(--dim);
  }
  .wordmark {
    font-family: var(--face-din);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin: 0;
    white-space: nowrap;
  }
  .wordmark .mark { color: var(--dim); }
  .claim {
    font-size: 12px;
    color: #9DAEB4;
    border-inline-start: 1px solid #33414B;
    padding-inline-start: 16px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .langpick { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; flex: none; }
  .langpick svg { width: 15px; height: 15px; stroke: #9DAEB4; fill: none; stroke-width: 1.5; }
  #language {
    font: inherit;
    font-size: 13px;
    color: #EDF1F2;
    background: #22303A;
    border: 1px solid #3B4C57;
    border-radius: 3px;
    padding: 4px 6px;
    cursor: pointer;
  }
  #language option { background: #22303A; color: #EDF1F2; }

  /* ------------------------------------------------------------ two panes */
  .workspace { flex: 1; display: flex; min-height: 0; }

  .rail {
    width: var(--rail);
    flex: none;
    background: var(--panel);
    border-inline-end: 1px solid var(--panel-edge);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .rail-scroll { flex: 1; overflow-y: auto; min-height: 0; }

  .step { padding: 15px 18px; border-bottom: 1px solid var(--panel-edge); }
  .step-head { display: flex; align-items: baseline; gap: 9px; margin-bottom: 11px; }
  .step-num {
    font-family: var(--face-num);
    font-size: 11px;
    color: var(--dim);
    letter-spacing: .04em;
  }
  .step-name {
    font-family: var(--face-din);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--ink);
    margin: 0;
  }
  .note { margin: 9px 0 0; font-size: 12px; color: var(--ink-soft); }

  /* --------------------------------------------------------------- inputs */
  button {
    font-family: var(--face-body);
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid #C9CEC8;
    border-radius: 3px;
    background: #FFF;
    color: var(--ink);
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  button:hover:not(:disabled) { background: #EFF1EE; border-color: #A9B1AB; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--dim); outline-offset: 2px; }

  .row { display: flex; gap: 7px; }
  .row > button { flex: 1; }

  .filepick {
    display: block;
    border: 1px dashed #B9C0BA;
    border-radius: 3px;
    background: #FFF;
    padding: 13px;
    text-align: center;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink-soft);
    transition: border-color .12s, background .12s;
  }
  .filepick:hover { border-color: var(--dim); background: #FFFCFB; color: var(--ink); }
  .filepick input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .filepick strong { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }

  /* Toggle between drawing and uploading */
  .switch {
    display: flex;
    background: #E9ECE8;
    border-radius: 3px;
    padding: 2px;
    margin-bottom: 11px;
  }
  .switch button {
    flex: 1;
    border: 0;
    background: transparent;
    padding: 5px 4px;
    font-size: 12.5px;
    color: var(--ink-soft);
    border-radius: 2px;
  }
  .switch button:hover:not([aria-selected=true]) { background: rgba(255,255,255,.6); }
  .switch button[aria-selected=true] {
    background: #FFF;
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(20,31,40,.12);
  }

  /* Transparency is shown by a checkerboard behind the canvas, never inside it */
  .checker {
    background-color: #FFF;
    background-image:
      linear-gradient(45deg, #E6E9E5 25%, transparent 25%, transparent 75%, #E6E9E5 75%),
      linear-gradient(45deg, #E6E9E5 25%, transparent 25%, transparent 75%, #E6E9E5 75%);
    background-size: 12px 12px;
    background-position: 0 0, 6px 6px;
  }
  #padCanvas {
    width: 100%;
    height: 122px;
    display: block;
    border: 1px solid #C9CEC8;
    border-radius: 3px;
    touch-action: none;
    cursor: crosshair;
  }
  #padCanvas:hover { border-color: #A9B1AB; }

  #sigPreview {
    margin-top: 10px;
    width: 100%;
    max-height: 62px;
    object-fit: contain;
    display: none;
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    padding: 4px;
  }

  .status { margin-top: 9px; font-size: 12px; min-height: 1em; color: var(--ink-soft); }
  .status.bad { color: var(--dim); }
  .status.good { color: var(--ok); }

  /* Save stays reachable no matter how short the window is */
  .rail-foot {
    flex: none;
    padding: 13px 18px;
    border-top: 1px solid var(--panel-edge);
    background: var(--panel);
  }
  #btnSave {
    width: 100%;
    padding: 11px;
    background: var(--dim);
    border-color: var(--dim);
    color: #FFF;
    font-weight: 600;
    font-size: 13.5px;
    letter-spacing: .02em;
  }
  #btnSave:hover:not(:disabled) { background: #A93C22; border-color: #A93C22; }
  #btnSave:disabled { background: #C9CEC8; border-color: #C9CEC8; color: #FFF; opacity: 1; }

  /* ---------------------------------------------------------------- stage */
  /* The document itself is never mirrored, not even in right-to-left layouts */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; direction: ltr; }

  .pagebar {
    flex: none;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 16px;
    background: var(--mat-deep);
    color: #C8D4D5;
    font-size: 12.5px;
    border-bottom: 1px solid rgba(0,0,0,.22);
  }
  .pagebar button {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    color: #DCE5E6;
    padding: 3px 10px;
    line-height: 1.35;
  }
  .pagebar button:hover:not(:disabled) { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.26); }
  .pagebar button:disabled { opacity: .3; }
  .pagebar label { font-family: var(--face-din); letter-spacing: .12em; text-transform: uppercase; font-size: 11px; }
  #pageSelect {
    font-family: var(--face-num);
    font-size: 12.5px;
    background: rgba(0,0,0,.26);
    color: #EDF1F2;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 3px;
    padding: 3px 5px;
    cursor: pointer;
  }
  #pageSelect option { background: #2F3E3F; }
  #pageCount { font-family: var(--face-num); color: #93A5A6; }
  .zoombar {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-inline-start: 10px;
    padding-inline-start: 10px;
    border-inline-start: 1px solid rgba(255,255,255,.14);
  }
  .zoombar button { min-width: 26px; text-align: center; }
  #zoomLabel {
    font-family: var(--face-num);
    font-size: 12px;
    color: #C8D4D5;
    min-width: 46px;
    cursor: pointer;
  }
  #placeState {
    margin-inline-start: auto;
    font-size: 11.5px;
    font-family: var(--face-din);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #93A5A6;
  }
  #placeState.here { color: #E9B4A5; }

  /* Millimetre grid, drawn in CSS so it costs no request */
  .stage {
    flex: 1;
    overflow: auto;
    padding: 30px;
    display: flex;
    /* safe: when the zoomed sheet is wider than the stage, fall back to the
       start edge so every part stays reachable by scrolling */
    justify-content: center;
    justify-content: safe center;
    align-items: flex-start;
    background-color: var(--mat);
    background-image:
      repeating-linear-gradient(0deg, var(--mat-line) 0 1px, transparent 1px 20px),
      repeating-linear-gradient(90deg, var(--mat-line) 0 1px, transparent 1px 20px),
      repeating-linear-gradient(0deg, var(--mat-line-5) 0 1px, transparent 1px 100px),
      repeating-linear-gradient(90deg, var(--mat-line-5) 0 1px, transparent 1px 100px);
  }

  .empty {
    margin-top: 70px;
    text-align: center;
    color: #A6B6B7;
    font-size: 13px;
    max-width: 300px;
  }
  .empty svg { width: 44px; height: 44px; stroke: #7C9092; fill: none; stroke-width: 1.2; margin-bottom: 12px; }
  .empty b { display: block; color: #D3DEDF; font-weight: 600; font-size: 14px; margin-bottom: 5px; }

  .sheet {
    position: relative;
    display: none;
    line-height: 0;
    background: var(--paper);
    box-shadow: 0 3px 10px rgba(0,0,0,.3), 0 14px 42px rgba(0,0,0,.24);
  }
  .sheet.on { display: inline-block; }
  #pageCanvas { display: block; }

  /* -------------------------------------------------- signature and dimensions */
  #sigBox {
    position: absolute;
    display: none;
    touch-action: none;
    cursor: grab;
    outline: 1px solid var(--dim);
    background: var(--dim-soft);
  }
  #sigBox.on { display: block; }
  #sigBox:active { cursor: grabbing; }
  #sigBox img { width: 100%; height: 100%; display: block; pointer-events: none; }

  /* Corner handle shaped like a registration mark rather than a generic dot */
  #handle {
    position: absolute;
    right: -7px;
    bottom: -7px;
    width: 15px;
    height: 15px;
    border-inline-end: 3px solid var(--dim);
    border-bottom: 3px solid var(--dim);
    background: rgba(255,255,255,.82);
    cursor: nwse-resize;
    touch-action: none;
  }

  /* Live measurements: the point of this tool made visible */
  .dim {
    position: absolute;
    font-family: var(--face-num);
    font-size: 10px;
    line-height: 1;
    color: var(--dim);
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
  }
  .dim-w {
    bottom: calc(100% + 5px);
    left: 0;
    right: 0;
    text-align: center;
    border-bottom: 1px solid var(--dim);
    padding-bottom: 3px;
  }
  .dim-w::before, .dim-w::after {
    content: "";
    position: absolute;
    bottom: -3px;
    width: 1px;
    height: 7px;
    background: var(--dim);
  }
  .dim-w::before { left: 0; }
  .dim-w::after { right: 0; }
  .dim-h {
    left: calc(100% + 5px);
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    border-left: 1px solid var(--dim);
    padding-left: 4px;
  }
  .dim-h::before, .dim-h::after {
    content: "";
    position: absolute;
    left: -3px;
    height: 1px;
    width: 7px;
    background: var(--dim);
  }
  .dim-h::before { top: 0; }
  .dim-h::after { bottom: 0; }
  .dim-xy {
    top: calc(100% + 5px);
    left: 0;
    background: var(--dim);
    color: #FFF;
    padding: 2px 5px;
    border-radius: 2px;
  }

  /* ------------------------------------------------------------ text step */
  .fld { display: block; margin: 0 0 9px; }
  .fld > span {
    display: block;
    font-family: var(--face-din);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .fld input, .fld select, .fld textarea {
    width: 100%;
    font: inherit;
    font-size: 13px;
    padding: 5px 7px;
    border: 1px solid #C9CEC8;
    border-radius: 3px;
    background: #FFF;
    color: var(--ink);
  }
  .fld input:focus, .fld select:focus, .fld textarea:focus { border-color: #A9B1AB; }
  .fld textarea { resize: vertical; min-height: 2.4em; line-height: 1.35; }
  .fld input[type="color"] { height: 30px; padding: 2px 3px; cursor: pointer; }
  .fld-2 { display: flex; gap: 7px; }
  .fld-2 .fld { flex: 1; min-width: 0; }

  /* Placed texts live above the page canvas but below the signature box */
  #textLayer { position: absolute; inset: 0; pointer-events: none; }
  .tbox {
    position: absolute;
    pointer-events: auto;
    cursor: grab;
    line-height: 1.2;
    white-space: pre;
    outline: 1px dashed transparent;
    outline-offset: 1px;
    user-select: none;
  }
  .tbox:hover { outline-color: rgba(192, 71, 43, .45); }
  .tbox.sel { outline-color: var(--dim); }
  .tbox:active { cursor: grabbing; }

  /* ------------------------------------------------------------ responsive */
  @media (max-width: 820px) {
    .workspace { flex-direction: column; }
    .rail { width: 100%; border-inline-end: 0; border-bottom: 1px solid var(--panel-edge); max-height: 52vh; }
    .claim { display: none; }
    .stage { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <h1 class="wordmark">Open PDF <span class="mark">Signer</span></h1>
  <span class="claim" data-i18n="claim"></span>
  <span class="langpick">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></svg>
    <select id="language" aria-label="Language"></select>
  </span>
</header>

<div class="workspace">
  <aside class="rail">
    <div class="rail-scroll">

      <section class="step">
        <div class="step-head">
          <span class="step-num">01</span>
          <h2 class="step-name" data-i18n="stepDocument"></h2>
        </div>
        <label class="filepick">
          <strong data-i18n="choosePdf"></strong>
          <span data-i18n="choosePdfHint"></span>
          <input type="file" id="pdfInput" accept="application/pdf,.pdf">
        </label>
        <div class="status" id="statusPdf"></div>
      </section>

      <section class="step">
        <div class="step-head">
          <span class="step-num">02</span>
          <h2 class="step-name" data-i18n="stepSignature"></h2>
        </div>
        <div class="switch" role="tablist">
          <button id="tabDraw" role="tab" aria-selected="true" data-i18n="tabDraw"></button>
          <button id="tabUpload" role="tab" aria-selected="false" data-i18n="tabUpload"></button>
        </div>

        <div id="paneDraw">
          <canvas id="padCanvas" class="checker"></canvas>
          <div class="row" style="margin-top:8px">
            <button id="btnClear" data-i18n="clear"></button>
            <button id="btnApply" data-i18n="apply"></button>
          </div>
          <p class="note" data-i18n="drawNote"></p>
        </div>

        <div id="paneUpload" hidden>
          <label class="filepick">
            <strong data-i18n="choosePng"></strong>
            <span data-i18n="choosePngHint"></span>
            <input type="file" id="pngInput" accept="image/png,.png">
          </label>
          <p class="note" data-i18n="uploadNote"></p>
        </div>

        <img id="sigPreview" class="checker" alt="">
        <div class="status" id="statusSignature"></div>
      </section>

      <section class="step">
        <div class="step-head">
          <span class="step-num">03</span>
          <h2 class="step-name" data-i18n="stepText"></h2>
        </div>
        <label class="fld">
          <span data-i18n="textField"></span>
          <textarea id="textInput" rows="2" data-i18n-ph="textPlaceholder"></textarea>
        </label>
        <label class="fld">
          <span data-i18n="textFont"></span>
          <select id="textFont"></select>
        </label>
        <p class="note" id="docFontNote" hidden></p>
        <div class="fld-2">
          <label class="fld">
            <span data-i18n="textSize"></span>
            <input type="number" id="textSize" min="4" max="200" step="0.5" value="12">
          </label>
          <label class="fld">
            <span data-i18n="textColor"></span>
            <input type="color" id="textColor" value="#111111">
          </label>
        </div>
        <div class="row">
          <button id="btnAddText" disabled data-i18n="textAdd"></button>
          <button id="btnRemoveText" disabled data-i18n="remove"></button>
        </div>
        <p class="note" data-i18n="textNote"></p>
        <div class="status" id="statusText"></div>
      </section>

      <section class="step">
        <div class="step-head">
          <span class="step-num">04</span>
          <h2 class="step-name" data-i18n="stepPlace"></h2>
        </div>
        <div class="row">
          <button id="btnPlace" disabled data-i18n="placeHere"></button>
          <button id="btnRemove" disabled data-i18n="remove"></button>
        </div>
        <p class="note" data-i18n="placeNote"></p>
        <div class="status" id="statusPlace"></div>
      </section>

      <section class="step" style="border-bottom:0">
        <div class="step-head">
          <span class="step-num">05</span>
          <h2 class="step-name" data-i18n="stepSave"></h2>
        </div>
        <p class="note" style="margin-top:0" data-i18n="saveNote"></p>
        <div class="status" id="statusSave"></div>
      </section>

    </div>

    <div class="rail-foot">
      <button id="btnSave" disabled data-i18n="saveButton"></button>
    </div>
  </aside>

  <main>
    <div class="pagebar">
      <button id="btnPrev" disabled aria-label="Previous page">&#9664;</button>
      <label for="pageSelect" data-i18n="page"></label>
      <select id="pageSelect" disabled></select>
      <span id="pageCount">&mdash;</span>
      <button id="btnNext" disabled aria-label="Next page">&#9654;</button>
      <span class="zoombar">
        <button id="btnZoomOut" disabled data-i18n-aria="zoomOut" aria-label="Zoom out">&#8722;</button>
        <button id="zoomLabel" disabled data-i18n-title="zoomFit" title="Reset zoom">&mdash;</button>
        <button id="btnZoomIn" disabled data-i18n-aria="zoomIn" aria-label="Zoom in">&#43;</button>
      </span>
      <span id="placeState"></span>
    </div>

    <div class="stage" id="stage">
      <div class="empty" id="empty">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8.5 16.5c1.2-1.6 2-3.4 2.7-2.2.7 1.2 1 2.6 1.9 1.4.9-1.2 1.6.3 2.4.8"/></svg>
        <b data-i18n="emptyTitle"></b>
        <span data-i18n="emptyBody"></span>
      </div>

      <div class="sheet" id="sheet">
        <canvas id="pageCanvas"></canvas>
        <div id="textLayer"></div>
        <div id="sigBox">
          <img id="sigImage" alt="">
          <span class="dim dim-w" id="dimW"></span>
          <span class="dim dim-h" id="dimH"></span>
          <span class="dim dim-xy" id="dimXY"></span>
          <div id="handle"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script>
(function () {
  "use strict";

  var WORKER_URL = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

  // ===========================================================================
  // Translations. Placeholders written as {n}, {name} and {msg}.
  // ===========================================================================
  var LANGUAGES = [
    ["en", "English"], ["zh", "中文"], ["hi", "हिन्दी"],
    ["es", "Español"], ["ar", "العربية"], ["fr", "Français"],
    ["pt", "Português"], ["ru", "Русский"], ["ja", "日本語"],
    ["de", "Deutsch"], ["id", "Indonesia"], ["tr", "Türkçe"],
    ["ko", "한국어"], ["it", "Italiano"], ["vi", "Tiếng Việt"]
  ];
  var RTL = { ar: true };

  var T = {
    en: {
      claim: "Runs entirely in your browser. Your file never leaves this computer.",
      stepDocument: "Document", choosePdf: "Choose a PDF", choosePdfHint: "or drop it here",

        var address = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));

    var data = pad.getImageData(0, 0, w, h).data;
    var minX = w, minY = h, maxX = -1, maxY = -1;

    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        if (data[(y * w + x) * 4 + 3] > 8) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return null;

    var pad2 = 8;
    minX = Math.max(0, minX - pad2);
    minY = Math.max(0, minY - pad2);
    maxX = Math.min(w - 1, maxX + pad2);
    maxY = Math.min(h - 1, maxY + pad2);

    var out = document.createElement("canvas");
    out.width = maxX - minX + 1;
    out.height = maxY - minY + 1;
    // Deliberately not filled: the alpha channel survives.
    out.getContext("2d").drawImage(padCanvas, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
    return out.toDataURL("image/png");
  }

  // ===========================================================================
  // Step 2b: upload a PNG
  // ===========================================================================
  pngInput.addEventListener("change", function () {
    var file = pngInput.files && pngInput.files[0];
    if (!file) return;
    if (file.type !== "image/png" && !/\.png$/i.test(file.name)) {
      say("statusSignature", "pngOnly", null, "bad");
      return;
    }
    var reader = new FileReader();
    reader.onload = function () { useSignature(reader.result, "pngApplied"); };
    reader.onerror = function () { say("statusSignature", "readFailed", null, "bad"); };
    reader.readAsDataURL(file);
  });

  // ===========================================================================
  // Take the signature on and place it
  // ===========================================================================
  function useSignature(dataUrl, messageKey) {
    var img = new Image();
    img.onload = function () {
      sigPng = dataUrl;
      sigRatio = img.naturalWidth / img.naturalHeight;
      sigImage.src = dataUrl;
      sigPreview.src = dataUrl;
      sigPreview.style.display = "block";
      say("statusSignature", messageKey, null, "good");

      if (pdfDoc) {
        if (placement) {
          // Keep the existing placement, only fit the height to the new image
          placement.h = placement.w / sigRatio;
        } else {
          placeOnCurrentPage();
        }
      }
      paintPlacement();
      refreshControls();
    };
    img.onerror = function () { say("statusSignature", "imageFailed", null, "bad"); };
    img.src = dataUrl;
  }

  function placeOnCurrentPage() {
    var g = geometry[pageNow];
    if (!g || !sigPng) return;
    var w = g.dispW * 0.3;
    var h = w / sigRatio;
    placement = { page: pageNow, x: (g.dispW - w) / 2, y: (g.dispH - h) / 2, w: w, h: h };
  }

  el("btnPlace").addEventListener("click", function () {
    if (!sigPng || !pdfDoc) return;
    placeOnCurrentPage();
    paintPlacement();
    refreshControls();
  });

  el("btnRemove").addEventListener("click", function () {
    placement = null;
    paintPlacement();
    refreshControls();
  });

  // ===========================================================================
  // Show the placement: points to screen pixels
  // ===========================================================================
  // Measured rather than assumed, so any CSS scaling of the canvas is covered
  // and this is the same factor the export maths uses.
  function pixelsPerPoint() {
    var g = geometry[pageNow];
    if (!g) return 1;
    return pageCanvas.getBoundingClientRect().width / g.dispW;
  }

  function paintPlacement() {
    var visible = !!(placement && sigPng && placement.page === pageNow);
    sigBox.classList.toggle("on", visible);

    if (visible) {
      var s = pixelsPerPoint();
      sigBox.style.left = (placement.x * s) + "px";
      sigBox.style.top = (placement.y * s) + "px";
      sigBox.style.width = (placement.w * s) + "px";
      sigBox.style.height = (placement.h * s) + "px";
      // Live dimensions in PDF points, the unit the export actually writes
      el("dimW").textContent = placement.w.toFixed(1) + " pt";
      el("dimH").textContent = placement.h.toFixed(1) + " pt";
      el("dimXY").textContent = "x " + placement.x.toFixed(1) + "  y " + placement.y.toFixed(1);
    }

    var state = el("placeState");
    state.classList.toggle("here", !!(placement && placement.page === pageNow));
    if (!pdfDoc || !sigPng) state.textContent = "";
    else if (!placement) state.textContent = t("stateNone");
    else if (placement.page === pageNow) state.textContent = t("stateHere");
    else state.textContent = t("stateOther", { n: placement.page });
  }

  // ===========================================================================
  // Move and scale
  // ===========================================================================
  var drag = null;

  function dragStart(ev) {
    if (!placement || placement.page !== pageNow) return;
    drag = {
      mode: ev.currentTarget === handle ? "scale" : "move",
      startX: ev.clientX,
      startY: ev.clientY,
      from: { x: placement.x, y: placement.y, w: placement.w, h: placement.h },
      s: pixelsPerPoint()
    };
    ev.currentTarget.setPointerCapture(ev.pointerId);
    ev.preventDefault();
    ev.stopPropagation();
  }

  function dragMove(ev) {
    if (!drag) return;
    var g = geometry[pageNow];
    var dx = (ev.clientX - drag.startX) / drag.s;   // in PDF points
    var dy = (ev.clientY - drag.startY) / drag.s;
    var a = drag.from;

    if (drag.mode === "move") {
      placement.x = Math.min(Math.max(a.x + dx, 0), Math.max(0, g.dispW - a.w));
      placement.y = Math.min(Math.max(a.y + dy, 0), Math.max(0, g.dispH - a.h));
    } else {
      // Proportional, anchored at the top left corner
      var w = Math.max(15, a.w + dx);
      w = Math.min(w, g.dispW - a.x);
      var h = w / sigRatio;
      if (a.y + h > g.dispH) {
        h = g.dispH - a.y;
        w = h * sigRatio;
      }
      placement.w = w;
      placement.h = h;
    }
    paintPlacement();
    ev.preventDefault();
  }

  function dragEnd(ev) {
    if (!drag) return;
    drag = null;
    if (ev.currentTarget.hasPointerCapture(ev.pointerId)) ev.currentTarget.releasePointerCapture(ev.pointerId);
  }

  [sigBox, handle].forEach(function (node) {
    node.addEventListener("pointerdown", dragStart);
    node.addEventListener("pointermove", dragMove);
    node.addEventListener("pointerup", dragEnd);
    node.addEventListener("pointercancel", dragEnd);
  });

  // ===========================================================================
  // Step 3: text
  // ===========================================================================
  // The document's own fonts are lifted out of pdf.js: every font a page
  // actually typesets is offered in the picker, and the same font bytes go
  // to a FontFace (for a true preview) and to pdf-lib on export.
  // ===========================================================================
  var STD_FONTS = [
    ["Helvetica", "Helvetica"], ["HelveticaBold", "Helvetica Bold"],
    ["HelveticaOblique", "Helvetica Italic"], ["HelveticaBoldOblique", "Helvetica Bold Italic"],
    ["TimesRoman", "Times Roman"], ["TimesRomanBold", "Times Roman Bold"],
    ["TimesRomanItalic", "Times Roman Italic"], ["TimesRomanBoldItalic", "Times Roman Bold Italic"],
    ["Courier", "Courier"], ["CourierBold", "Courier Bold"], ["CourierOblique", "Courier Italic"]
  ];

  var measureCtx = document.createElement("canvas").getContext("2d");

  function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }

  function textById(id) {
    for (var i = 0; i < texts.length; i++) if (texts[i].id === id) return texts[i];
    return null;
  }

  function selItem() { return selectedText == null ? null : textById(selectedText); }

  // Collect the fonts this page typesets, straight out of pdf.js. Fonts the
  // text layer merely references but never draws stay unlisted.
  function collectFonts(page) {
    // getTextContent alone leaves commonObjs unresolved; the operator list
    // pass is what makes the FontFaceObject data readable.
    page.getOperatorList().then(function () {
      return page.getTextContent();
    }).then(function (content) {
      var usage = {};   // loadedName -> characters set on this page
      for (var i = 0; i < content.items.length; i++) {
        var it = content.items[i];
        if (it.fontName && it.str) usage[it.fontName] = (usage[it.fontName] || 0) + it.str.length;
      }
      var changed = false, best = null, bestN = 0;
      for (var name in usage) {
        if (usage[name] > bestN) { bestN = usage[name]; best = name; }
        if (docFonts[name]) { docFonts[name].chars += usage[name]; continue; }
        var face = null;
        try { face = page.commonObjs.get(name); } catch (e) {}
        // No font data means a non-embedded standard font: nothing to lift
        // out, the Standard section of the picker covers those.
        if (!face || !face.data) continue;
        var f = {
          label: String(face.name || name).replace(/^[A-Z]{6}\+/, ""),
          data: face.data,
          cssFam: null, faceBad: false,
          kf: null, kfBad: false,
          chars: usage[name]
        };
        // fontkit mirrors the parse pdf-lib does on export. If the font is
        // not readable, mark it now so it shows up disabled in the picker.
        if (typeof fontkit !== "undefined") {
          try { f.kf = fontkit.create(face.data); }
          catch (e) { f.kfBad = true; }
        }
        docFonts[name] = f;
        changed = true;
      }
      if (best) pageFontBest[page.pageNumber || pageNow] = best;
      if (changed) rebuildFontSelect();
    }).catch(function () {
      // Pages without a text layer simply offer the standard fonts.
    });
  }

  function rebuildFontSelect() {
    var prev = fontSel.value;
    fontSel.innerHTML = "";
    var names = Object.keys(docFonts);
    if (names.length) {
      var gd = document.createElement("optgroup");
      gd.label = t("fontsDoc");
      names.sort(function (a, b) { return docFonts[b].chars - docFonts[a].chars; });
      for (var i = 0; i < names.length; i++) {
        var f = docFonts[names[i]];
        var o = document.createElement("option");
        o.value = "doc:" + names[i];
        o.textContent = f.label + (f.kfBad ? " — " + t("fontBroken") : "");
        o.disabled = !!f.kfBad;
        gd.appendChild(o);
      }
      fontSel.appendChild(gd);
    }
    var gs = document.createElement("optgroup");
    gs.label = t("fontsStd");
    for (var j = 0; j < STD_FONTS.length; j++) {
      var o2 = document.createElement("option");
      o2.value = "std:" + STD_FONTS[j][0];
      o2.textContent = STD_FONTS[j][1];
      gs.appendChild(o2);
    }
    fontSel.appendChild(gs);
    fontSel.value = prev;
    if (fontSel.value !== prev) fontSel.value = preferredFontKey();
    paintDocFontNote();
  }

  // Small note under the picker naming the fonts the document actually
  // uses — the same list the picker groups under "document fonts", most
  // used first, so it stays readable even on font-heavy files.
  function paintDocFontNote() {
    var node = el("docFontNote");
    var names = Object.keys(docFonts);
    if (!names.length) { node.hidden = true; node.textContent = ""; return; }
    names.sort(function (a, b) { return docFonts[b].chars - docFonts[a].chars; });
    var labels = [];
    for (var i = 0; i < names.length && labels.length < 3; i++) {
      var lb = docFonts[names[i]].label;
      if (labels.indexOf(lb) < 0) labels.push(lb);
    }
    node.textContent = t("fontUses", { fonts: labels.join(", ") });
    node.hidden = false;
  }

  // The document font that carries the most text, preferring this page.
  function preferredFontKey() {
    var best = pageFontBest[pageNow];
    if (best && docFonts[best] && !docFonts[best].kfBad) return "doc:" + best;
    var top = null, n = 0;
    for (var k in docFonts) {
      if (!docFonts[k].kfBad && docFonts[k].chars > n) { n = docFonts[k].chars; top = k; }
    }
    return top ? "doc:" + top : "std:Helvetica";
  }

  // Document fonts render through the real font file via FontFace, so the
  // preview matches what the export writes. Standard fonts fall back to
  // their closest system family.
  function previewFamily(fontKey) {
    if (fontKey.indexOf("doc:") === 0) {
      var f = docFonts[fontKey.slice(4)];
      if (!f || f.faceBad) return "serif";
      if (!f.cssFam) {
        f.cssFam = "opsdoc" + (++faceSeq);
        try {
          new FontFace(f.cssFam, f.data).load().then(function (loaded) {
            document.fonts.add(loaded);
            paintTexts();
          }).catch(function () { f.faceBad = true; f.cssFam = null; });
        } catch (e) {
          f.faceBad = true; f.cssFam = null;
          return "serif";
        }
      }
      return "'" + f.cssFam + "', serif";
    }
    var std = fontKey.slice(4);
    if (std.indexOf("Times") === 0) return "'Times New Roman', Times, serif";
    if (std.indexOf("Courier") === 0) return "'Courier New', Courier, monospace";
    return "Helvetica, Arial, sans-serif";
  }

  // PDF anchors text at the baseline, CSS at the line box. The div is
  // shifted so the first baseline lands exactly on item.y: up by the
  // measured ascent plus the half-leading of the 1.2em line-height.
  function topPxFor(it, s) {
    var px = it.size * s;
    var asc = px * 0.8, desc = px * 0.25;
    measureCtx.font = px + "px " + previewFamily(it.fontKey);
    try {
      var m = measureCtx.measureText("MgÅy");
      if (m.fontBoundingBoxAscent) asc = m.fontBoundingBoxAscent;
      if (m.fontBoundingBoxDescent) desc = m.fontBoundingBoxDescent;
    } catch (e) {}
    var halfLead = Math.max(0, (px * 1.2 - (asc + desc)) / 2);
    return it.y * s - asc - halfLead;
  }

  function paintTexts() {
    while (textLayer.firstChild) textLayer.removeChild(textLayer.firstChild);
    if (!pdfDoc) return;
    var s = pixelsPerPoint();
    for (var i = 0; i < texts.length; i++) {
      var it = texts[i];
      if (it.page !== pageNow) continue;
      var d = document.createElement("div");
      d.className = "tbox" + (it.id === selectedText ? " sel" : "");
      d.textContent = it.text;
      d.style.left = (it.x * s) + "px";
      d.style.top = topPxFor(it, s) + "px";
      d.style.fontSize = (it.size * s) + "px";
      d.style.fontFamily = previewFamily(it.fontKey);
      d.style.color = it.color;
      d.setAttribute("data-id", it.id);
      textLayer.appendChild(d);
    }
  }

  // WinAnsi codepoints beyond Latin-1 the standard fonts still encode.
  var WINANSI_EXTRA = {};
  [0x20AC, 0x0192, 0x201E, 0x2026, 0x2020, 0x2021, 0x02C6, 0x2030, 0x0160, 0x2039,
   0x0152, 0x017D, 0x2018, 0x2019, 0x201C, 0x201D, 0x2022, 0x2013, 0x2014, 0x02DC,
   0x2122, 0x0161, 0x203A, 0x0153, 0x017E, 0x0178].forEach(function (cp) {
    WINANSI_EXTRA[cp] = true;
  });

  // Characters the chosen font cannot draw — checked before writing so a
  // subsetted document font never produces silent blank output.
  function missingGlyphs(fontKey, text) {
    var isDoc = fontKey.indexOf("doc:") === 0;
    var kf = null;
    if (isDoc) {
      var f = docFonts[fontKey.slice(4)];
      if (!f) return [fontKey];
      kf = f.kf;
      if (!kf && !f.kfBad && typeof fontkit !== "undefined") {
        try { kf = f.kf = fontkit.create(f.data); } catch (e) { f.kfBad = true; }
      }
      if (!kf) return [];   // no fontkit: the export reports the real error
    }
    var seen = {}, out = [];
    for (var i = 0; i < text.length; i++) {
      var cp = text.codePointAt(i);
      if (cp > 0xFFFF) i++;             // surrogate pairs count once
      if (cp === 10 || cp === 13) continue;
      var ok = isDoc ? kf.hasGlyphForCodePoint(cp)
                     : (cp >= 0x20 && cp <= 0xFF) || WINANSI_EXTRA[cp] === true;
      if (!ok && !seen[cp]) { seen[cp] = true; out.push(String.fromCodePoint(cp)); }
    }
    return out;
  }

  function glyphWarn(it) {
    var miss = missingGlyphs(it.fontKey, it.text);
    if (miss.length) say("statusText", "fontNoGlyphs", { chars: miss.join(" ") }, "bad");
    else if (statusState.statusText && statusState.statusText.key === "fontNoGlyphs") {
      say("statusText", null);
    }
  }

  function selectText(id) {
    if (id === selectedText) return;   // the pane already edits this item
    selectedText = id;
    var it = selItem();
    if (it) {
      textInput.value = it.text;
      fontSel.value = it.fontKey;
      sizeInput.value = it.size;
      colorInput.value = it.color;
      say("statusText", "textEditing", { n: it.page });
      glyphWarn(it);
    } else {
      say("statusText", null);
    }
    paintTexts();
    refreshControls();
  }

  // With an item selected every field edits it live; without one the pane
  // is the draft the next Add uses.
  textInput.addEventListener("input", function () {
    var it = selItem();
    if (!it) return;
    it.text = textInput.value;
    glyphWarn(it);
    paintTexts();
  });
  fontSel.addEventListener("change", function () {
    var it = selItem();
    if (!it) return;
    it.fontKey = fontSel.value;
    glyphWarn(it);
    paintTexts();
  });
  sizeInput.addEventListener("input", function () {
    var it = selItem();
    if (!it) return;
    it.size = readSize();
    paintTexts();
  });
  colorInput.addEventListener("input", function () {
    var it = selItem();
    if (!it) return;
    it.color = colorInput.value;
    paintTexts();
  });

  function readSize() {
    var v = parseFloat(sizeInput.value);
    return isFinite(v) ? clamp(v, 4, 200) : 12;
  }

  function textsOnPage(n) {
    var c = 0;
    for (var i = 0; i < texts.length; i++) if (texts[i].page === n) c++;
    return c;
  }

  el("btnAddText").addEventListener("click", function () {
    if (!pdfDoc) return;
    var txt = textInput.value;
    if (!txt.replace(/\s/g, "")) { say("statusText", "textEmpty", null, "bad"); return; }
    var g = geometry[pageNow];
    if (!g) return;
    var size = readSize();
    var base = selItem();
    var x, y;
    if (base) {
      // Adding while a text is selected drops a copy a little offset.
      x = Math.min(base.x + size, Math.max(0, g.dispW - 8));
      y = Math.min(base.y + size * 1.7, g.dispH - 4);
    } else {
      x = g.dispW * 0.12;
      y = g.dispH * 0.2 + textsOnPage(pageNow) * size * 1.7;
    }
    var it = {
      id: ++textSeq, page: pageNow, x: x, y: y,
      text: txt, fontKey: fontSel.value, size: size, color: colorInput.value
    };
    texts.push(it);
    selectText(it.id);
    say("statusText", "placedOn", { n: pageNow }, "good");
    glyphWarn(it);
  });

  el("btnRemoveText").addEventListener("click", function () {
    if (selectedText == null) return;
    texts = texts.filter(function (it) { return it.id !== selectedText; });
    selectedText = null;
    paintTexts();
    refreshControls();
    say("statusText", "textRemoved");
  });

  // Move only — size comes from the field, so there is no corner handle.
  var tdrag = null;

  textLayer.addEventListener("pointerdown", function (ev) {
    var node = ev.target.closest ? ev.target.closest(".tbox") : null;
    if (!node) return;
    var it = textById(parseInt(node.getAttribute("data-id"), 10));
    if (!it) return;
    selectText(it.id);   // repaints, so re-grab the fresh node
    tdrag = {
      node: textLayer.querySelector('[data-id="' + it.id + '"]') || node,
      it: it,
      sx: ev.clientX, sy: ev.clientY,
      fx: it.x, fy: it.y, s: pixelsPerPoint()
    };
    textLayer.setPointerCapture(ev.pointerId);
    ev.preventDefault();
    ev.stopPropagation();
  });

  textLayer.addEventListener("pointermove", function (ev) {
    if (!tdrag) return;
    var g = geometry[pageNow];
    var it = tdrag.it;
    var lines = it.text.split("\n").length;
    var yMax = g.dispH - (lines - 1) * it.size * 1.2 - it.size * 0.3;
    it.x = clamp(tdrag.fx + (ev.clientX - tdrag.sx) / tdrag.s, 0, Math.max(0, g.dispW - 8));
    it.y = clamp(tdrag.fy + (ev.clientY - tdrag.sy) / tdrag.s, it.size * 0.8, Math.max(it.size * 0.8, yMax));
    tdrag.node.style.left = (it.x * tdrag.s) + "px";
    tdrag.node.style.top = topPxFor(it, tdrag.s) + "px";
    ev.preventDefault();
  });

  function tdragEnd(ev) {
    if (!tdrag) return;
    tdrag = null;
    if (textLayer.hasPointerCapture(ev.pointerId)) textLayer.releasePointerCapture(ev.pointerId);
    paintTexts();
  }
  textLayer.addEventListener("pointerup", tdragEnd);
  textLayer.addEventListener("pointercancel", tdragEnd);

  pageCanvas.addEventListener("pointerdown", function () {
    if (selectedText != null) selectText(null);
  });

  // ===========================================================================
  // Step 5: export
  // ===========================================================================
  el("btnSave").addEventListener("click", function () {
    var hasSig = !!(sigPng && placement);
    if (!originalBytes || (!hasSig && !texts.length)) return;

    // Missing glyphs would end up as silent blank spots — check before
    // anything is written.
    for (var i = 0; i < texts.length; i++) {
      var miss = missingGlyphs(texts[i].fontKey, texts[i].text);
      if (miss.length) {
        say("statusSave", "fontNoGlyphs", { chars: miss.join(" ") }, "bad");
        return;
      }
    }
    say("statusSave", "writing");

    var PDFDocument = PDFLib.PDFDocument;
    var degrees = PDFLib.degrees;

    // ignoreEncryption covers PDFs that only set permissions.
    // updateMetadata: false keeps the document's own Producer, Creator,
    // dates and every other Info entry — nothing but the marks gets added.
    PDFDocument.load(originalBytes, { ignoreEncryption: true, updateMetadata: false }).then(function (doc) {
      var needKit = texts.some(function (it) { return it.fontKey.indexOf("doc:") === 0; });
      if (needKit) {
        if (typeof fontkit === "undefined") throw new Error(t("fontkitMissing"));
        doc.registerFontkit(fontkit);
      }

      var jobs = [];

      if (hasSig) {
        jobs.push(doc.embedPng(sigPng).then(function (image) {
          var page = doc.getPage(placement.page - 1);
          var g = geometry[placement.page];

          // CropBox from pdf.js, the same source the preview was built from.
          var bx1 = g.view[0], by1 = g.view[1], bx2 = g.view[2], by2 = g.view[3];
          var boxW = bx2 - bx1;   // unrotated
          var boxH = by2 - by1;
          var r = g.rotation;

          // Display space counts y downwards, PDF counts it upwards.
          var X = placement.x;
          var Y = g.dispH - (placement.y + placement.h);

          // Convert display space back into the unrotated page space.
          // Rotating the image cancels out the display rotation again.
          var bx, by;
          if (r === 90) { bx = boxW - Y; by = X; }
          else if (r === 180) { bx = boxW - X; by = boxH - Y; }
          else if (r === 270) { bx = Y; by = boxH - X; }
          else { bx = X; by = Y; }

          page.drawImage(image, {
            x: bx + bx1,          // account for the CropBox offset
            y: by + by1,
            width: placement.w,
            height: placement.h,
            rotate: degrees(r)
          });
        }));
      }

      // Each distinct font is embedded once, then every text is drawn with it.
      var fontJobs = {};
      texts.forEach(function (it) {
        if (fontJobs[it.fontKey]) return;
        if (it.fontKey.indexOf("doc:") === 0) {
          var f = docFonts[it.fontKey.slice(4)];
          if (!f) throw new Error(t("fontEmbedFail", { msg: it.fontKey }));
          fontJobs[it.fontKey] = Promise.resolve(doc.embedFont(f.data, { subset: true })).catch(function (e) {
            throw new Error(t("fontEmbedFail", { msg: e && e.message ? e.message : String(e) }));
          });
        } else {
          fontJobs[it.fontKey] = Promise.resolve(doc.embedFont(PDFLib.StandardFonts[it.fontKey.slice(4)]));
        }
      });

      var keys = Object.keys(fontJobs);
      jobs.push(Promise.all(keys.map(function (k) { return fontJobs[k]; })).then(function (fonts) {
        var map = {};
        keys.forEach(function (k, i) { map[k] = fonts[i]; });
        texts.forEach(function (it) {
          var g = geometry[it.page];
          if (!g) return;
          var page = doc.getPage(it.page - 1);
          var bx1 = g.view[0], by1 = g.view[1], bx2 = g.view[2], by2 = g.view[3];
          var boxW = bx2 - bx1, boxH = by2 - by1, r = g.rotation;

          // y is the first baseline — the same anchor the preview uses.
          var X = it.x;
          var Y = g.dispH - it.y;
          var bx, by;
          if (r === 90) { bx = boxW - Y; by = X; }
          else if (r === 180) { bx = boxW - X; by = boxH - Y; }
          else if (r === 270) { bx = Y; by = boxH - X; }
          else { bx = X; by = Y; }

          var c = it.color;
          page.drawText(it.text, {
            x: bx + bx1,
            y: by + by1,
            size: it.size,
            font: map[it.fontKey],
            color: PDFLib.rgb(
              parseInt(c.slice(1, 3), 16) / 255,
              parseInt(c.slice(3, 5), 16) / 255,
              parseInt(c.slice(5, 7), 16) / 255
            ),
            rotate: degrees(r),
            lineHeight: it.size * 1.2
          });
        });
      }));

      return Promise.all(jobs).then(function () { return doc.save(); });
    }).then(function (bytes) {
      var blob = new Blob([bytes], { type: "application/pdf" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = originalName.replace(/\.pdf$/i, "") + "-signed.pdf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
      say("statusSave", "saved", { name: a.download }, "good");
    }).catch(function (err) {
      say("statusSave", "saveFailed", { msg: err && err.message ? err.message : String(err) }, "bad");
    });
  });

  // ===========================================================================
  // Control availability
  // ===========================================================================
  function refreshControls() {
    var hasPdf = !!pdfDoc;
    el("btnPrev").disabled = !hasPdf || pageNow <= 1;
    el("btnNext").disabled = !hasPdf || pageNow >= pageTotal;
    el("btnZoomOut").disabled = !hasPdf || zoom <= ZOOM_MIN;
    el("btnZoomIn").disabled = !hasPdf || zoom >= ZOOM_MAX;
    el("zoomLabel").disabled = !hasPdf;
    el("btnPlace").disabled = !hasPdf || !sigPng;
    el("btnRemove").disabled = !placement;
    el("btnAddText").disabled = !hasPdf;
    el("btnRemoveText").disabled = selectedText == null;
    el("btnSave").disabled = !(hasPdf && ((sigPng && placement) || texts.length));

    if (!hasPdf) say("statusPlace", null);
    else if (!sigPng) say("statusPlace", "needSignature");
    else if (!placement) say("statusPlace", "notPlaced");
    else say("statusPlace", "placedOn", { n: placement.page }, "good");
  }

  applyLanguage();
  refreshControls();
})();
</script>
</body>
</html>
